included:
  - glance

excluded:
  - glance/Models
  - glance/Resources
  - glance/Assets.xcassets

disabled_rules:
  # Owned by Apple's `swift-format` (`.swift-format`), which intentionally breaks
  # multi-line condition lists and wrapped closure parameters across lines.
  - opening_brace
  - closure_parameter_position

line_length:
  warning: 120
  error: 160
  ignores_comments: true
  ignores_urls: true
  ignores_interpolated_strings: true

file_length:
  warning: 450
  error: 650
  ignore_comment_only_lines: true

type_body_length:
  warning: 350
  error: 500

function_body_length:
  warning: 65
  error: 100

cyclomatic_complexity:
  warning: 14
  error: 20
  ignores_case_statements: true

identifier_name:
  min_length:
    warning: 2
    error: 1
  max_length:
    warning: 50
    error: 60
  excluded:
    - a
    - b
    - c
    - d
    - e
    - g
    - h
    - i
    - j
    - k
    - m
    - n
    - p
    - q
    - r
    - s
    - t
    - u
    - v
    - w
    - x
    - y
    - z
    - id
    - fd
    - tx
    - ty
    - dx
    - dy
    - cx
    - cy
    - lo
    - hi
    - s1
    - s2
    - sc
    - ss
    - gy
    - gx
    - ts
    - hn
    - ti
    - ok
